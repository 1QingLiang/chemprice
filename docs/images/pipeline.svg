<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="gDeep3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B4E5C"/>
      <stop offset="100%" stop-color="#15414E"/>
    </linearGradient>
    <marker id="ar3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#8AA6B0"/>
    </marker>
    <marker id="arGold" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#C9A227"/>
    </marker>
    <filter id="soft3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#15414E" flood-opacity="0.09"/>
    </filter>
  </defs>
  <rect width="1000" height="520" fill="#F7F9FA" rx="14"/>
  <text x="500" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#15414E">数据流与凭据模型</text>
  <text x="500" y="63" text-anchor="middle" font-size="12.5" fill="#7A8C93">采集 → 预计算 → 对外服务；凭据只存在于运行期环境变量</text>

  <!-- 数据链路 -->
  <rect x="30" y="88" width="600" height="250" rx="12" fill="#FFFFFF" stroke="#DCE6E9" filter="url(#soft3)"/>
  <text x="50" y="114" font-size="13" font-weight="700" fill="#15414E">数据链路</text>

  <rect x="52" y="132" width="168" height="58" rx="10" fill="#EAF7F4" stroke="#9FDCCB"/>
  <text x="136" y="157" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15414E">采集任务</text>
  <text x="136" y="176" text-anchor="middle" font-size="11" fill="#5E7A80">定时触发</text>

  <rect x="252" y="132" width="168" height="58" rx="10" fill="#EAF7F4" stroke="#9FDCCB"/>
  <text x="336" y="157" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15414E">交易日历校验</text>
  <text x="336" y="176" text-anchor="middle" font-size="11" fill="#5E7A80">调休补班日按交易日处理</text>

  <rect x="452" y="132" width="158" height="58" rx="10" fill="#EAF7F4" stroke="#9FDCCB"/>
  <text x="531" y="157" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15414E">行情入库</text>
  <text x="531" y="176" text-anchor="middle" font-size="11" fill="#5E7A80">MySQL 业务表</text>

  <line x1="220" y1="161" x2="252" y2="161" stroke="#8AA6B0" stroke-width="1.6" marker-end="url(#ar3)"/>
  <line x1="420" y1="161" x2="452" y2="161" stroke="#8AA6B0" stroke-width="1.6" marker-end="url(#ar3)"/>

  <!-- 第二段 -->
  <rect x="52" y="212" width="558" height="106" rx="10" fill="#FBF6E6" stroke="#E6D493"/>
  <text x="70" y="236" font-size="12.5" font-weight="700" fill="#8A7320">预计算统计表（低变更 · 高频读）</text>
  <text x="70" y="258" font-size="11.5" fill="#7A6A2C">定时任务在低峰期刷新统计结果，前端与开放 API 只读统计表</text>
  <text x="70" y="280" font-size="11.5" fill="#7A6A2C">避免对大表做实时聚合，保证接口响应稳定在毫秒级</text>
  <text x="70" y="302" font-size="11.5" fill="#7A6A2C">统计表按「维度 × 时间」预聚合，支持省市下钻与品种切换</text>

  <line x1="331" y1="190" x2="331" y2="212" stroke="#C9A227" stroke-width="1.6" marker-end="url(#arGold)"/>

  <!-- 右侧凭据模型 -->
  <rect x="652" y="88" width="318" height="250" rx="12" fill="url(#gDeep3)" filter="url(#soft3)"/>
  <text x="672" y="114" font-size="13" font-weight="700" fill="#FFFFFF">凭据模型</text>
  <text x="672" y="140" font-size="11.5" fill="#CFE9E2">源码仓库内只有占位符，无任何真值：</text>

  <rect x="672" y="152" width="278" height="30" rx="7" fill="#0F3540" stroke="#2C6470"/>
  <text x="688" y="172" font-size="11.5" fill="#CFE9E2" font-family="Consolas,Monaco,monospace">${DB_PASSWORD}</text>
  <rect x="672" y="190" width="278" height="30" rx="7" fill="#0F3540" stroke="#2C6470"/>
  <text x="688" y="210" font-size="11.5" fill="#CFE9E2" font-family="Consolas,Monaco,monospace">${MAIL_PASSWORD}</text>
  <rect x="672" y="228" width="278" height="30" rx="7" fill="#0F3540" stroke="#2C6470"/>
  <text x="688" y="248" font-size="11.5" fill="#CFE9E2" font-family="Consolas,Monaco,monospace">${JWT_SECRET}</text>

  <text x="672" y="282" font-size="11.5" fill="#8FC7B9">真值存放于服务器凭据文件（权限 600），</text>
  <text x="672" y="300" font-size="11.5" fill="#8FC7B9">进程启动时注入，不落任何仓库文件。</text>
  <text x="672" y="322" font-size="11" fill="#D9B449">定时脚本自行加载凭据文件（cron 不继承环境）</text>

  <!-- 底部铁律 -->
  <rect x="30" y="358" width="940" height="132" rx="12" fill="#FFFFFF" stroke="#DCE6E9"/>
  <text x="50" y="384" font-size="13" font-weight="700" fill="#15414E">仓库约定</text>
  <g font-size="12" fill="#41575E">
    <text x="50" y="410">① 凭据一律不落盘 —— 密码 / 密钥 / Token / 证书只经环境变量注入，绝不写入任何被提交的文件</text>
    <text x="50" y="434">② 对外不出现数据供应商名称 —— 统一口径「数据来源：ChemPrice 化工价格平台」</text>
    <text x="50" y="458">③ 提交前自动体检 —— 路径白名单 + 高置信度凭据模式扫描 + 配置占位符完整性校验</text>
    <text x="50" y="482">④ 数据库脚本只含表结构与脱敏样例数据，不含任何真实业务数据</text>
  </g>
</svg>
