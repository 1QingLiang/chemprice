<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 545" width="1000" height="545" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="soft4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#15414E" flood-opacity="0.09"/>
    </filter>
  </defs>
  <rect width="1000" height="545" fill="#F7F9FA" rx="14"/>
  <text x="500" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#15414E">权限模型 · 四维正交</text>
  <text x="500" y="63" text-anchor="middle" font-size="12.5" fill="#7A8C93">四个维度彼此独立，互不覆盖；管理端可分别授予与回收</text>

  <!-- 中心 -->
  <circle cx="500" cy="290" r="66" fill="#15414E" filter="url(#soft4)"/>
  <text x="500" y="284" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">用户</text>
  <text x="500" y="304" text-anchor="middle" font-size="11" fill="#8FC7B9">角色 · 状态</text>

  <!-- 四个维度块 -->
  <rect x="60" y="120" width="300" height="112" rx="12" fill="#FFFFFF" stroke="#9FDCCB" stroke-width="1.5" filter="url(#soft4)"/>
  <rect x="60" y="120" width="6" height="112" rx="3" fill="#5ECBB0"/>
  <text x="84" y="148" font-size="13.5" font-weight="700" fill="#15414E">① 数据权限</text>
  <text x="84" y="172" font-size="11.5" fill="#5E7A80">商品白名单，逐品种授权</text>
  <text x="84" y="194" font-size="11.5" fill="#5E7A80">决定可浏览的行情与商品范围</text>
  <text x="84" y="216" font-size="11.5" font-weight="700" fill="#3FA890">永久有效，不设到期日</text>

  <rect x="640" y="120" width="300" height="112" rx="12" fill="#FFFFFF" stroke="#9FDCCB" stroke-width="1.5" filter="url(#soft4)"/>
  <rect x="640" y="120" width="6" height="112" rx="3" fill="#5ECBB0"/>
  <text x="664" y="148" font-size="13.5" font-weight="700" fill="#15414E">② 导出权限</text>
  <text x="664" y="172" font-size="11.5" fill="#5E7A80">独立开关，控制数据导出能力</text>
  <text x="664" y="194" font-size="11.5" fill="#5E7A80">与数据权限解耦，分别配置</text>
  <text x="664" y="216" font-size="11.5" fill="#5E7A80">导出行为写入审计日志</text>

  <rect x="60" y="350" width="300" height="112" rx="12" fill="#FFFFFF" stroke="#E6D493" stroke-width="1.5" filter="url(#soft4)"/>
  <rect x="60" y="350" width="6" height="112" rx="3" fill="#C9A227"/>
  <text x="84" y="378" font-size="13.5" font-weight="700" fill="#15414E">③ 标点地图</text>
  <text x="84" y="402" font-size="11.5" fill="#5E7A80">开关与日期共同判定是否可用</text>
  <text x="84" y="424" font-size="11.5" fill="#5E7A80">支持永久 / 30 / 90 / 180 / 365 天</text>
  <text x="84" y="446" font-size="11.5" font-weight="700" fill="#8A7320">到期日在当天仍有效，次日失效</text>

  <rect x="640" y="350" width="300" height="112" rx="12" fill="#FFFFFF" stroke="#E6D493" stroke-width="1.5" filter="url(#soft4)"/>
  <rect x="640" y="350" width="6" height="112" rx="3" fill="#C9A227"/>
  <text x="664" y="378" font-size="13.5" font-weight="700" fill="#15414E">④ 开放 API</text>
  <text x="664" y="402" font-size="11.5" fill="#5E7A80">独立开通开关 + 积分额度</text>
  <text x="664" y="424" font-size="11.5" fill="#5E7A80">按端点计费，元数据免费</text>
  <text x="664" y="446" font-size="11.5" fill="#5E7A80">额度原子扣减，超额返 429</text>

  <!-- 连线 -->
  <g stroke="#C3D4D9" stroke-width="1.4">
    <line x1="360" y1="176" x2="440" y2="256"/>
    <line x1="640" y1="176" x2="560" y2="256"/>
    <line x1="360" y1="406" x2="440" y2="326"/>
    <line x1="640" y1="406" x2="560" y2="326"/>
  </g>

  <!-- 底部横条 -->
  <rect x="60" y="486" width="880" height="52" rx="12" fill="#FFFFFF" stroke="#DCE6E9"/>
  <text x="500" y="509" text-anchor="middle" font-size="12" fill="#41575E">授权接口<tspan font-weight="700" fill="#15414E">幂等</tspan>，只对启用状态账号生效，且每次变更自动写入<tspan font-weight="700" fill="#15414E">审计日志</tspan></text>
  <text x="500" y="528" text-anchor="middle" font-size="11.5" fill="#7A8C93">管理员账号始终具备全部权限，无需单独授权</text>
</svg>
